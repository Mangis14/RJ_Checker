name: build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    # Tajomstva su tu, aby sa v kroku nizsie dali testovat cez `env`. Ak nie su
    # nastavene, su prazdne a nahravanie na Drive sa preskoci.
    env:
      RCLONE_CONFIG_BASE64: ${{ secrets.RCLONE_CONFIG_BASE64 }}
      DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # Testy gatuju build: ked spadne logika, APK sa ani nezacne stavat.
      # `core` je cisty Kotlin/JVM, takze na testy netreba Android SDK.
      - name: Test core
        run: ./gradlew :core:test --no-daemon

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-report
          path: |
            core/build/reports/tests/test
            core/build/test-results/test
          if-no-files-found: warn

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rjseat-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Nahratie do Google Drive bezi len ak su nastavene tajomstva. Bez nich sa
      # krok ticho preskoci, takze build funguje aj bez Drive.
      #
      # Rclone zamerne namiesto service accountu: service account ma nulovu
      # uloznu kvotu a nahratie do zlozky v osobnom Disku zlyha na
      # "storageQuotaExceeded". Rclone je autorizovany vlastnym uctom.
      # Podmienka cez env, nie priamo cez secrets: kontext `secrets` sa v
      # step-level `if` sprava nespolahlivo, kym `env` funguje vzdy.
      - name: Copy APK to Google Drive
        if: env.RCLONE_CONFIG_BASE64 != '' && env.DRIVE_FOLDER_ID != ''
        run: |
          curl -fsSL https://rclone.org/install.sh | sudo bash
          mkdir -p ~/.config/rclone
          echo "$RCLONE_CONFIG_BASE64" | base64 -d > ~/.config/rclone/rclone.conf
          NAME="rjseat-$(date +%Y-%m-%d-%H%M)-$(git rev-parse --short HEAD).apk"
          rclone copyto app/build/outputs/apk/debug/app-debug.apk "gdrive:$NAME" \
            --drive-root-folder-id "$DRIVE_FOLDER_ID"
          echo "Nahrate ako $NAME"
